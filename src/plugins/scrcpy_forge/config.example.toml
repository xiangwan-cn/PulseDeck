# Building with `--features scrcpy-forge` creates config.d/90-scrcpy-forge.toml
# when no `scrcpy-forge` page exists. This file is a standalone module that can
# be copied there to customize every option explicitly.

schema_version = 2

[[pages]]
id = "scrcpy-forge"
title = "设备"
icon = "phone-symbolic"
order = 25
kind = "scrcpy-forge"

[pages.plugin]
api_url = "http://127.0.0.1:27180/api/v1"
daemon_program = "scrcpy-forge-daemon"
daemon_args = []
preview_interval_seconds = 5
metadata_interval_seconds = 10
health_interval_seconds = 3
columns = 3
card_width = 180
card_height = 252
preview_height = 180

[pages.plugin.endpoints]
health = "health"
shutdown = "shutdown"
devices = "devices"
connect = "devices/connect"
device_preview = "devices/{serial}/screenshot"
session_preview = "sessions/{serial}/frame.jpg"
session_metrics = "sessions/{serial}/metrics"
tasks = "scripts"
task_runs = "scripts/runs"
sessions = "sessions"
session_start = "sessions/{serial}/start"
task_run = "scripts/run-named"
task_stop = "scripts/devices/{serial}/stop"
profile = "sessions/{serial}/{kind}"

[[pages.plugin.cards]]
role = "backend"
title = "ScrcpyForge"
description = "后端运行状态与启停开关"
order = 10

[[pages.plugin.cards]]
role = "devices"
title = "设备预览"
description = "每台设备生成一张独立预览卡"
order = 20

[[pages.plugin.cards]]
role = "scripts"
title = "设备脚本"
description = "每台设备生成一张对应脚本卡"
order = 30
