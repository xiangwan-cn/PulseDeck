schema_version = 3

[app]
title = "PulseDeck"
reload_on_change = true
log_level = "info"
max_output_bytes = 20000

[runtime]
keep_screen_on = true
idle_power_saving = true
idle_timeout_seconds = 60
idle_stability_seconds = 10
idle_visual_brightness_percent = 15
refresh_saving_strength = "balanced"
external_realtime = true
external_prevents_idle = true
external_sample_seconds = 10
external_enter_samples = 3
external_exit_samples = 2
codex_keep_bright = true
codex_protection_minutes = 60
codex_attention_seconds = 15
codex_completion_sound = true
bring_to_foreground_on_attention = false
cpu_activity_hint = false
idle_display = "dim"

[ui]
default_page = "monitor"
compact = true
card_columns = 3
card_height = 133
fixed_card_size = true

[[pages]]
id = "monitor"
title = "监控"
icon = "computer-symbolic"
order = 10

[[pages]]
id = "actions"
title = "操作"
icon = "system-run-symbolic"
order = 20

[[pages]]
id = "settings"
title = "设置"
icon = "preferences-system-symbolic"
order = 30

[[cards]]
id = "cpu"
title = "CPU 使用率"
page = "monitor"
order = 10
renderer = "progress"
refresh = "5s"
icon = "computer-symbolic"
description = "处理器总占用"

source = { builtin = "cpu" }

[[cards]]
id = "memory"
title = "内存使用"
page = "monitor"
order = 20
renderer = "progress"
refresh = "10s"
icon = "chip-symbolic"
description = "已用 / 总量"

source = { builtin = "memory" }

[[cards]]
id = "battery"
title = "电池电量"
page = "monitor"
order = 30
renderer = "progress"
refresh = "30s"
icon = "battery-level-100-symbolic"
description = "当前剩余容量"

source = { builtin = "battery_capacity" }

[[cards]]
id = "battery-temp"
title = "电池温度"
page = "monitor"
order = 40
renderer = "value"
refresh = "30s"
icon = "sensors-temperature-symbolic"
description = "电池当前温度"

source = { builtin = "battery_temperature" }

[cards.display.transition]
duration_ms = 220
easing = "ease-out"

[[cards.display.states]]
name = "comfortable"
max = 39.9

[cards.display.states.colors]
accent = "#33d17a"
value = "#33d17a"

[[cards.display.states]]
name = "hot"
min = 45.0
label = "温度过高"

[cards.display.states.colors]
accent = "#e01b24"
background = ["#e01b24", "#9141ac"]

[[cards]]
id = "uptime"
title = "运行时间"
page = "monitor"
order = 50
renderer = "value"
refresh = "1m"
icon = "hourglass-symbolic"
description = "系统已运行时长"

source = { builtin = "uptime" }

[[cards]]
id = "power"
title = "实时功耗"
page = "monitor"
order = 60
renderer = "value"
refresh = "15s"
icon = "battery-symbolic"
description = "瞬时与平均功耗 · 预估剩余时长"

source = { builtin = "power" }

[[cards]]
id = "network-status"
title = "网络状态"
page = "monitor"
order = 70
renderer = "status"
refresh = "15s"
icon = "network-wireless-signal-excellent-symbolic"
description = "连接状态与 IP 地址"

source = { builtin = "network" }

[[cards]]
id = "scheduled-command-example"
title = "定时命令示例"
page = "monitor"
order = 80
renderer = "text"
refresh = "1h"
cache_ttl = "1d"
schedule = "daily@08:00,20:00"
enabled = false

source = { command = { run = ["date", "+%F %T"], timeout = "5s" } }

[[actions]]
id = "system-summary"
name = "查看系统信息"
description = "显示当前系统内核和架构"
icon = "utilities-system-monitor-symbolic"
page = "actions"
timeout = 5
confirm = false
command = ["uname", "-a"]
