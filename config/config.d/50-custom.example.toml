# Standalone module example. Copy it into ~/.config/pulsedeck/config.d/
# and choose a descriptive file name such as 50-workstation.toml.
schema_version = 3
name = "custom-cards"

[[cards]]
id = "kernel-release"
title = "内核版本"
page = "monitor"
order = 85
renderer = "text"
refresh = "1h"
icon = "utilities-terminal-symbolic"

source = { command = { run = ["uname", "-r"], timeout = "5s" } }
