[app]
title = "PulseDeck"
reload_on_change = true
log_level = "info"
max_output_bytes = 20000

[runtime]
keep_screen_on = true
idle_power_saving = true
idle_timeout_seconds = 60
idle_stability_seconds = 10
idle_visual_brightness_percent = 15
refresh_saving_strength = "balanced"
external_realtime = true
external_prevents_idle = true
external_sample_seconds = 10
external_enter_samples = 3
external_exit_samples = 2
codex_keep_bright = true
codex_protection_minutes = 60
codex_attention_seconds = 15
codex_completion_sound = true
bring_to_foreground_on_attention = false
cpu_activity_hint = false
idle_display = "dim"

[ui]
default_page = "monitor"
compact = true
# 普通模式 3 列 x 3 行、紧凑模式 6 列 x 3 行；宽度等分，高度按可见区自适应。
card_columns = 3
card_height = 133 # 自适应卡高的下限
fixed_card_size = true
# card_width = 180

[[pages]]
id = "monitor"
title = "监控"
icon = "computer-symbolic"
order = 10

[[pages]]
id = "actions"
title = "操作"
icon = "system-run-symbolic"
order = 20

[[pages]]
id = "settings"
title = "设置"
icon = "preferences-system-symbolic"
order = 30

[[cards]]
id = "cpu"
title = "CPU 使用率"
page = "monitor"
order = 10
renderer = "progress"
refresh_interval = 5
icon = "computer-symbolic"
description = "处理器总占用"

[cards.source]
type = "builtin"
metric = "cpu"

[[cards]]
id = "memory"
title = "内存使用"
page = "monitor"
order = 20
renderer = "progress"
refresh_interval = 10
icon = "chip-symbolic"
description = "已用 / 总量"

[cards.source]
type = "builtin"
metric = "memory"

[[cards]]
id = "battery"
title = "电池电量"
page = "monitor"
order = 30
renderer = "progress"
refresh_interval = 30
icon = "battery-level-100-symbolic"
description = "当前剩余容量"

[cards.source]
type = "builtin"
metric = "battery_capacity"

[[cards]]
id = "battery-temp"
title = "电池温度"
page = "monitor"
order = 40
renderer = "value"
refresh_interval = 30
icon = "sensors-temperature-symbolic"
description = "电池当前温度"

[cards.source]
type = "builtin"
metric = "battery_temperature"

[[cards]]
id = "uptime"
title = "运行时间"
page = "monitor"
order = 50
renderer = "value"
refresh_interval = 60
icon = "hourglass-symbolic"
description = "系统已运行时长"

[cards.source]
type = "builtin"
metric = "uptime"

[[cards]]
id = "power"
title = "实时功耗"
page = "monitor"
order = 60
renderer = "value"
refresh_interval = 15
icon = "battery-symbolic"
description = "瞬时与平均功耗 · 预估剩余时长"

[cards.source]
type = "builtin"
metric = "power"

[[cards]]
id = "network-status"
title = "网络状态"
page = "monitor"
order = 70
renderer = "status"
refresh_interval = 15
icon = "network-wireless-signal-excellent-symbolic"
description = "连接状态与 IP 地址"

[cards.source]
type = "builtin"
metric = "network"

[[cards]]
id = "scheduled-command-example"
title = "定时命令示例"
page = "monitor"
order = 80
renderer = "text"
refresh_interval = 3600
cache_ttl_seconds = 86400
schedule = "daily@08:00,20:00"
enabled = false
icon = "alarm-symbolic"
description = "每天在配置时间点运行一次"

[cards.source]
type = "command"
program = "date"
args = ["+%F %T"]
timeout_seconds = 5

# 可选原生指标（默认不创建卡片）：load_average、swap、process_count、
# cpu_temperature、filesystem、network_traffic。
# 复制任一 [[cards]]，并将 source.type 设为 builtin、metric 设为上述名称即可，
# 只改配置，无需重新编译。

[[actions]]
id = "system-summary"
name = "查看系统信息"
description = "显示当前系统内核和架构"
icon = "utilities-system-monitor-symbolic"
page = "actions"
visible = true
timeout = 5
confirm = false
# confirm_title = "确认查看系统信息？"
# confirm_detail = "将执行 uname -a 并显示结果。"
command = ["uname", "-a"]
