name: PulseDeck CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libadwaita-1-dev pkg-config xvfb

      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
          cache: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all features
        run: cargo check --all-features

      - name: Check minimal features
        run: cargo check --no-default-features

      - name: Test all features
        run: xvfb-run --auto-servernum cargo test --all-features

      - name: Test minimal features
        run: xvfb-run --auto-servernum cargo test --no-default-features

      - name: Clippy all targets
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Clippy minimal targets
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Release build and metadata
        run: cargo build --release --all-features

      - name: Minimal release build
        run: cargo build --release --no-default-features

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.1
          cache: true

      - name: Install audit tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Audit lockfile
        run: cargo audit --deny warnings

      - name: Check dependency policy
        run: cargo deny check
